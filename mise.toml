[tools]
node = "24"
"ubi:saghul/txiki.js" = { version = "26.6.0", exe = "tjs" }

# Size-optimized build recipes, ordered smallest binary first.
#
# Measured on this machine (macOS arm64, tjs v26.6.0, 2026-08-19) by building
# each task and stat'ing the linked binary:
#
#   task                                    bytes      MiB   FFI  TLS  crypto.subtle  hardened
#   (the two SQLite rows were measured the same way on 2026-08-20)
#   build:smallest-lite-with-ffi            1,614,928  1.54  yes  no   no             no
#   build:smallest-compressed               1,730,384  1.65  no   no   yes            no
#   build:smallest-compressed-with-ffi      1,781,232  1.70  yes  no   yes            no
#   dist:min                                1,976,112  1.88  no   no   yes            yes
#   build:smallest-slim                     1,978,064  1.89  no   no   yes            no
#   build:smallest                          1,994,576  1.90  no   no   yes            no
#   dist:ffi                                2,026,944  1.93  yes  no   yes            yes
#   dist:tuned-min                          2,057,888  1.96  no   no   yes            yes
#   build:smallest-tls                      2,161,808  2.06  no   yes  yes            no
#   dist:balanced-min                       2,189,136  2.09  no   no   yes            yes
#   dist:tls                                2,456,752  2.34  no   yes  yes            yes
#   dist:ffi-tls                            2,507,584  2.39  yes  yes  yes            yes
#   dist:sqlite                             2,906,224  2.77  no   no   yes            yes
#   dist:ffi-tls-sqlite                     3,421,184  3.26  yes  yes  yes            yes
#
# SQLite is the most expensive optional feature by a distance: ~875 KB, more
# than TLS + the bundled CA together.
#
# Every task above: MinSizeRel/-Oz, LTO, dead-strip, ICF, hidden visibility,
# symbol strip, no unwind tables, no mimalloc, no WASM, and no SQLite except in
# the two `*sqlite` profiles. The `dist:*`
# tasks add BUILD_WITH_HARDENING (+~245 KB of PAC/BTI prologues and stack
# protectors) and are what CI publishes; they also smoke-test the result.
#
# Two exceptions to the codegen half of that: `dist:tuned-min` keeps -Oz + LTO
# but disables Clang's AArch64 machine outliner (+82 KB, ~30% faster), and
# `dist:balanced-min` drops to -Os with no LTO (+213 KB, ~41% faster). Both
# measured against dist:min on this machine with a fib/property/sort/string/Map
# workload; the outliner is the whole story behind -Oz's interpreter slowdown.
#
# Two shared gotchas, not repeated per task below:
#   * bundles are regenerated through the DEFAULT build/ toolchain, because
#     `make` re-runs its CMakeCache rule with Release/mimalloc defaults and
#     would clobber a MinSizeRel config if pointed at one. src/bundles is shared
#     by every build dir, so each task restores the full-CLI uncompressed
#     bundles afterwards.
#   * the slim CLI gates out `test`, so those binaries cannot run the suite on
#     themselves -- the `test:*` tasks below smoke them via `run` instead.

# TRUE floor + FFI: also drops crypto.subtle (WinterTC-breaking, and it breaks
# `tjs app pack`/`compile`, which hash via subtle.digest).
[tasks."build:smallest-lite-with-ffi"]
description = "Smallest tjs with FFI: floor + webcrypto off (1.54 MiB)"
alias = "tiny-ffi"
run = """
SLIM_DEFINES="--define:__TJS_EVAL__=false --define:__TJS_SERVE__=false \
--define:__TJS_BUNDLER__=false --define:__TJS_TEST_RUNNER__=false \
--define:__TJS_COMPILE__=true --define:__TJS_APP__=false \
--define:__TJS_HELP__=false --define:__TJS_TLS_CA__=false"

make -B core stdlib RUN_MAIN_DEFINES="$SLIM_DEFINES" TJSC_COMPRESS=-z

cmake -B build-smallest-lite-ffi \
  -DCMAKE_BUILD_TYPE=MinSizeRel \
  -DBUILD_WITH_WASM=OFF \
  -DBUILD_WITH_SQLITE=OFF \
  -DBUILD_WITH_TLS=OFF \
  -DBUILD_WITH_FFI=ON \
  -DBUILD_WITH_WEBCRYPTO=OFF \
  -DBUILD_WITH_MIMALLOC=OFF \
  -DBUILD_WITH_OZ=ON \
  -DBUILD_WITH_LTO=ON \
  -DBUILD_WITH_GC_SECTIONS=ON \
  -DBUILD_WITH_HIDDEN_VISIBILITY=ON \
  -DBUILD_WITH_ICF=ON \
  -DBUILD_WITH_STRIP=ON \
  -DBUILD_WITH_NO_UNWIND_TABLES=ON \
  -DBUILD_WITH_COMPRESSED_BYTECODE=ON \
  -DBUILD_WITH_REPRODUCIBLE_PATHS=ON \
  -DCMAKE_C_FLAGS="-DTJS_NO_TLS_CA"
cmake --build build-smallest-lite-ffi

make -B core stdlib

ls -lh build-smallest-lite-ffi/tjs
"""

[tasks."test:smallest-lite-with-ffi"]
description = "Smoke the smallest-with-FFI build"
depends = ["build:smallest-lite-with-ffi"]
run = """
cat > /tmp/tjs-lite-ffi-smoke.js <<'EOF'
import assert from 'tjs:assert';
import ffi from 'tjs:ffi';

// FFI must actually dlopen and call into libc.
let lib;

for (const name of [ 'libSystem.B.dylib', 'libc.so.6', 'libc.so' ]) {
    try {
        lib = new ffi.Lib(name);
        break;
    } catch { /* try next */ }
}

assert.ok(lib, 'dlopen libc');
const abs = new ffi.CFunction(lib.symbol('abs'), ffi.types.sint, [ ffi.types.sint ]);
assert.eq(abs.call(-42), 42, 'ffi abs()');

// Compressed bundles must inflate.
assert.eq(typeof fetch, 'function', 'fetch polyfill');
assert.ok(new URLPattern({ pathname: '/:id' }).test('https://x.test/42'), 'URLPattern');
assert.eq(new URL('https://x.test/p?q=1').pathname, '/p', 'URL');

// Expected omissions for this profile.
assert.eq(typeof crypto.getRandomValues, 'function', 'getRandomValues kept');
assert.eq(typeof crypto.subtle, 'undefined', 'crypto.subtle dropped');
assert.eq(typeof WebAssembly, 'undefined', 'WebAssembly dropped');

console.log('smallest-lite-with-ffi smoke: OK');
EOF
./build-smallest-lite-ffi/tjs run /tmp/tjs-lite-ffi-smoke.js"""

# The floor with WebCrypto kept: every optional feature off, every size knob on,
# slim CLI, and miniz-deflated bytecode (tjsc -z, inflated lazily in eval.c).
[tasks."build:smallest-compressed"]
description = "Absolute smallest tjs with WebCrypto (1.65 MiB)"
alias = ["tiny", "build:smallest-possible"]
run = """
SLIM_DEFINES="--define:__TJS_EVAL__=false --define:__TJS_SERVE__=false \
--define:__TJS_BUNDLER__=false --define:__TJS_TEST_RUNNER__=false \
--define:__TJS_COMPILE__=true --define:__TJS_APP__=false \
--define:__TJS_HELP__=false --define:__TJS_TLS_CA__=false"

make -B core stdlib RUN_MAIN_DEFINES="$SLIM_DEFINES" TJSC_COMPRESS=-z

cmake -B build-smallest-compressed \
  -DCMAKE_BUILD_TYPE=MinSizeRel \
  -DBUILD_WITH_WASM=OFF \
  -DBUILD_WITH_SQLITE=OFF \
  -DBUILD_WITH_TLS=OFF \
  -DBUILD_WITH_FFI=OFF \
  -DBUILD_WITH_MIMALLOC=OFF \
  -DBUILD_WITH_OZ=ON \
  -DBUILD_WITH_LTO=ON \
  -DBUILD_WITH_GC_SECTIONS=ON \
  -DBUILD_WITH_HIDDEN_VISIBILITY=ON \
  -DBUILD_WITH_ICF=ON \
  -DBUILD_WITH_STRIP=ON \
  -DBUILD_WITH_NO_UNWIND_TABLES=ON \
  -DBUILD_WITH_COMPRESSED_BYTECODE=ON \
  -DBUILD_WITH_REPRODUCIBLE_PATHS=ON \
  -DCMAKE_C_FLAGS="-DTJS_NO_TLS_CA"
cmake --build build-smallest-compressed

make -B core stdlib

ls -lh build-smallest-compressed/tjs
"""

[tasks."test:smallest-compressed"]
description = "Smoke the smallest + compressed build"
depends = ["build:smallest-compressed"]
run = """
cat > /tmp/tjs-smc-smoke.js <<'EOF'
import assert from 'tjs:assert';
assert.eq(1 + 1, 2, 'arithmetic');
assert.eq(typeof fetch, 'function', 'fetch polyfill');
assert.ok(new URLPattern({ pathname: '/:id' }).test('https://x.test/42'), 'URLPattern');
assert.eq(new URL('https://x.test/p?q=1').pathname, '/p', 'URL');
console.log('smallest-compressed smoke: OK');
EOF
./build-smallest-compressed/tjs run /tmp/tjs-smc-smoke.js"""

[tasks."build:smallest-compressed-with-ffi"]
description = "build:smallest-compressed + tjs:ffi, unhardened (1.70 MiB)"
run = """
SLIM_DEFINES="--define:__TJS_EVAL__=false --define:__TJS_SERVE__=false \
--define:__TJS_BUNDLER__=false --define:__TJS_TEST_RUNNER__=false \
--define:__TJS_COMPILE__=true --define:__TJS_APP__=false \
--define:__TJS_HELP__=false --define:__TJS_TLS_CA__=false"

make -B core stdlib RUN_MAIN_DEFINES="$SLIM_DEFINES" TJSC_COMPRESS=-z

cmake -B build-smallest-compressed-ffi \
  -DCMAKE_BUILD_TYPE=MinSizeRel \
  -DBUILD_WITH_WASM=OFF \
  -DBUILD_WITH_SQLITE=OFF \
  -DBUILD_WITH_TLS=OFF \
  -DBUILD_WITH_FFI=ON \
  -DBUILD_WITH_MIMALLOC=OFF \
  -DBUILD_WITH_OZ=ON \
  -DBUILD_WITH_LTO=ON \
  -DBUILD_WITH_GC_SECTIONS=ON \
  -DBUILD_WITH_HIDDEN_VISIBILITY=ON \
  -DBUILD_WITH_ICF=ON \
  -DBUILD_WITH_STRIP=ON \
  -DBUILD_WITH_NO_UNWIND_TABLES=ON \
  -DBUILD_WITH_COMPRESSED_BYTECODE=ON \
  -DBUILD_WITH_REPRODUCIBLE_PATHS=ON \
  -DCMAKE_C_FLAGS="-DTJS_NO_TLS_CA"
cmake --build build-smallest-compressed-ffi

make -B core stdlib

ls -lh build-smallest-compressed-ffi/tjs
"""

# ---------------------------------------------------------------------------
# Published profiles. `mise run dist -- --profile X` is the single source of
# truth (scripts/build-dist.mjs); CI runs the very same command per platform.
# ---------------------------------------------------------------------------

[tasks."dist:min"]
description = "Published profile: no FFI, no TLS (1.88 MiB)"
run = "node scripts/build-dist.mjs --profile min --build-dir build-dist-min --out dist/min"

[tasks."dist:balanced-min"]
description = "Published balanced profile: -Os, no LTO, no FFI, no TLS (2.09 MiB)"
run = "node scripts/build-dist.mjs --profile min --optimization balanced --build-dir build-dist-balanced-min --out dist/balanced-min"

[tasks."dist:tuned-min"]
description = "Published tuned profile: -Oz + LTO with the machine outliner off, no FFI, no TLS (1.96 MiB)"
run = "node scripts/build-dist.mjs --profile min --optimization tuned --build-dir build-dist-tuned-min --out dist/tuned-min"

[tasks."build:smallest-slim"]
description = "Smallest binary + slim CLI, uncompressed bytecode (1.89 MiB)"
run = """
SLIM_DEFINES="--define:__TJS_EVAL__=false --define:__TJS_SERVE__=false \
--define:__TJS_BUNDLER__=false --define:__TJS_TEST_RUNNER__=false \
--define:__TJS_COMPILE__=true --define:__TJS_APP__=false \
--define:__TJS_HELP__=false --define:__TJS_TLS_CA__=false"

make -B src/bundles/c/core/run-main.c RUN_MAIN_DEFINES="$SLIM_DEFINES"

cmake -B build-smallest-slim \
  -DCMAKE_BUILD_TYPE=MinSizeRel \
  -DBUILD_WITH_WASM=OFF \
  -DBUILD_WITH_SQLITE=OFF \
  -DBUILD_WITH_TLS=OFF \
  -DBUILD_WITH_FFI=OFF \
  -DBUILD_WITH_MIMALLOC=OFF \
  -DBUILD_WITH_OZ=ON \
  -DBUILD_WITH_LTO=ON \
  -DBUILD_WITH_GC_SECTIONS=ON \
  -DBUILD_WITH_HIDDEN_VISIBILITY=ON \
  -DBUILD_WITH_ICF=ON \
  -DBUILD_WITH_STRIP=ON \
  -DBUILD_WITH_NO_UNWIND_TABLES=ON \
  -DCMAKE_C_FLAGS="-DTJS_NO_TLS_CA"
cmake --build build-smallest-slim

make -B src/bundles/c/core/run-main.c

ls -lh build-smallest-slim/tjs
"""

# `build:smallest-slim` gates the test runner out, so this build cannot run the
# suite on itself -- the full-CLI ./build/tjs drives the loop instead.
[tasks."test:smallest-slim"]
description = "Run tests against the smallest + slim-CLI build"
depends = ["build:smallest-slim"]
run = "TJS_TEST_EXE=$(pwd)/build-smallest-slim/tjs ./build/tjs test tests/"

# Full CLI, so this one can run the suite on itself.
[tasks."build:smallest"]
description = "Every optional feature off + all size knobs, full CLI (1.90 MiB)"
run = """
cmake -B build-smallest \
  -DCMAKE_BUILD_TYPE=MinSizeRel \
  -DBUILD_WITH_WASM=OFF \
  -DBUILD_WITH_SQLITE=OFF \
  -DBUILD_WITH_TLS=OFF \
  -DBUILD_WITH_FFI=OFF \
  -DBUILD_WITH_MIMALLOC=OFF \
  -DBUILD_WITH_OZ=ON \
  -DBUILD_WITH_LTO=ON \
  -DBUILD_WITH_GC_SECTIONS=ON \
  -DBUILD_WITH_HIDDEN_VISIBILITY=ON \
  -DBUILD_WITH_ICF=ON \
  -DBUILD_WITH_STRIP=ON \
  -DBUILD_WITH_NO_UNWIND_TABLES=ON
cmake --build build-smallest

ls -lh build-smallest/tjs
"""

[tasks."test:smallest"]
description = "Run tests against the smallest build"
depends = ["build:smallest"]
run = "./build-smallest/tjs test tests/"

# Byte-identical to the old build:smallest-compressed-with-ffi-hardened recipe,
# which is kept as an alias.
[tasks."dist:ffi"]
description = "Published profile: FFI, no TLS (1.93 MiB)"
alias = ["build:smallest-compressed-with-ffi-hardened", "tiny-ffi-hardened"]
run = "node scripts/build-dist.mjs --profile ffi --build-dir build-dist-ffi --out dist/ffi"

# Keeps --tls-ca and its C setter (unlike the TLS-less builds) so a custom trust
# store can be pointed at at runtime.
[tasks."build:smallest-tls"]
description = "Smallest binary with TLS + bundled CA, unhardened (2.06 MiB)"
alias = "tiny-tls"
run = """
SLIM_DEFINES="--define:__TJS_EVAL__=false --define:__TJS_SERVE__=false \
--define:__TJS_BUNDLER__=false --define:__TJS_TEST_RUNNER__=false \
--define:__TJS_COMPILE__=true --define:__TJS_APP__=false \
--define:__TJS_HELP__=false --define:__TJS_TLS_CA__=true"

make -B core stdlib RUN_MAIN_DEFINES="$SLIM_DEFINES" TJSC_COMPRESS=-z

cmake -B build-smallest-tls \
  -DCMAKE_BUILD_TYPE=MinSizeRel \
  -DBUILD_WITH_WASM=OFF \
  -DBUILD_WITH_SQLITE=OFF \
  -DBUILD_WITH_FFI=OFF \
  -DBUILD_WITH_MIMALLOC=OFF \
  -DBUILD_WITH_TLS=ON \
  -DBUILD_WITH_BUNDLED_CA=ON \
  -DBUILD_WITH_WEBCRYPTO=ON \
  -DBUILD_WITH_OZ=ON \
  -DBUILD_WITH_LTO=ON \
  -DBUILD_WITH_GC_SECTIONS=ON \
  -DBUILD_WITH_HIDDEN_VISIBILITY=ON \
  -DBUILD_WITH_ICF=ON \
  -DBUILD_WITH_STRIP=ON \
  -DBUILD_WITH_NO_UNWIND_TABLES=ON \
  -DBUILD_WITH_COMPRESSED_BYTECODE=ON \
  -DBUILD_WITH_REPRODUCIBLE_PATHS=ON
cmake --build build-smallest-tls

make -B core stdlib

ls -lh build-smallest-tls/tjs
"""

[tasks."dist:tls"]
description = "Published profile: TLS + bundled CA, no FFI (2.34 MiB)"
run = "node scripts/build-dist.mjs --profile tls --build-dir build-dist-tls --out dist/tls"

[tasks."dist:ffi-tls"]
description = "Published profile: FFI + TLS + bundled CA (2.39 MiB)"
run = "node scripts/build-dist.mjs --profile ffi-tls --build-dir build-dist-ffi-tls --out dist/ffi-tls"

[tasks."dist:sqlite"]
description = "Published profile: SQLite, no FFI, no TLS (2.77 MiB)"
run = "node scripts/build-dist.mjs --profile sqlite --build-dir build-dist-sqlite --out dist/sqlite"

[tasks."dist:ffi-tls-sqlite"]
description = "Published profile: FFI + TLS + bundled CA + SQLite, the widest (3.26 MiB)"
run = "node scripts/build-dist.mjs --profile ffi-tls-sqlite --build-dir build-dist-ffi-tls-sqlite --out dist/ffi-tls-sqlite"

# Raw driver; extra args are forwarded, e.g. `mise run dist -- --profile tls`.
[tasks.dist]
description = "Build a published profile into dist/ (defaults to --profile ffi)"
run = "node scripts/build-dist.mjs"

[tasks."dist:all"]
description = "Build every published profile"
depends = ["dist:balanced-min", "dist:tuned-min", "dist:min", "dist:ffi", "dist:tls", "dist:ffi-tls", "dist:sqlite", "dist:ffi-tls-sqlite"]
run = "ls -lh dist/*/tjs"

# The dist profiles have `tjs test` compiled out, so they cannot drive the suite
# themselves. TJS_TEST_EXE lets the full-CLI ./build/tjs run the loop while the
# shipped artifact executes every test file via `run` -- which is the binary we
# actually want covered. The skip filter probes the artifact, not the host.
# Note the {{arg}} template: mise appends bare task arguments to the end of the
# command line, so a plain "$1" would always be empty here.
[tasks."test:dist"]
description = "Run the full suite against a dist artifact, e.g. `mise run test:dist ffi`"
run = 'TJS_TEST_EXE=$(pwd)/dist/{{arg(name="profile", default="ffi")}}/tjs ./build/tjs test tests/'

# ---------------------------------------------------------------------------
# Upstream sync. See .claude/plans/2026-08-19_fork-upstream-sync-reliability.md.
# ---------------------------------------------------------------------------

# Merge cadence is weekly, unconditionally: the cost of a merge is superlinear
# in drift. At upstream's ~134 commits/90 d a weekly merge is ~10 commits; a
# quarterly one is ~45 commits across the 39 files this fork also touches.
[tasks."sync:upstream"]
description = "Merge upstream/master into this branch, regenerating the bundles"
run = """
set -eu
sh scripts/setup-repo.sh

git fetch upstream
git tag "pre-merge/$(date +%Y-%m-%d-%H%M)"

if ! git merge upstream/master; then
  echo
  echo "conflicts outside the generated files -- resolve these, then run 'mise run sync:regen':"
  git diff --name-only --diff-filter=U
  exit 1
fi

mise run sync:regen
"""

# Separate task so it can be re-run by hand after a manual conflict resolution.
# `make js` reads src/js/**, so it must run AFTER the last edit there and its
# output must go into the merge commit. Running it before, or skipping it,
# produces bundles that disagree with their sources -- CI's codegen job catches
# that, but only after the push.
[tasks."sync:regen"]
description = "Regenerate the committed bundles from the merged sources"
run = """
set -eu
make js
git add src/bundles/c
git status --porcelain --untracked-files=no
"""

[tasks."test:dist:all"]
description = "Run the full suite against every published profile"
run = """
set -eu
for p in balanced-min tuned-min min ffi tls ffi-tls sqlite ffi-tls-sqlite; do
  echo "==> $p"
  TJS_TEST_EXE="$(pwd)/dist/$p/tjs" ./build/tjs test tests/
done
"""

# CI's Lint job (.github/workflows/ci.yml) runs `clang-format -i src/*.{c,h}` on
# ubuntu-24.04 with the distro package -- clang-format 18 -- and fails on a dirty
# tree. So 18 is the reference version, and a newer local formatter (Homebrew
# ships 22) reformats files CI then rejects, with no way to reproduce the failure
# locally. `make format` cannot know that; this task refuses instead of guessing.
[tasks."format"]
description = "clang-format src/, pinned to the version CI's Lint job uses (18)"
run = """
set -eu
REQUIRED=18
CF="${CLANG_FORMAT:-}"
if [ -z "$CF" ]; then
  if command -v clang-format-$REQUIRED >/dev/null 2>&1; then
    CF="clang-format-$REQUIRED"
  else
    CF="clang-format"
  fi
fi
GOT="$("$CF" --version | sed -E 's/.*version ([0-9]+).*/\\1/')"
if [ "$GOT" != "$REQUIRED" ]; then
  echo "clang-format $GOT found ($CF), but CI formats with $REQUIRED." >&2
  echo "Formatting with $GOT would red the Lint job in a way you cannot reproduce here." >&2
  echo "Install it (brew install llvm@$REQUIRED / apt install clang-format-$REQUIRED)," >&2
  echo "then re-run, or point CLANG_FORMAT at the $REQUIRED binary." >&2
  exit 1
fi
"$CF" -i src/*.c src/*.h
git status --porcelain --untracked-files=no -- src
"""

# src/cacert.c is `merge=keep-ours` (it is miniz-compressed, upstream's is plain
# PEM), so an upstream refresh never reaches us -- the bundle only moves when
# someone runs this. Cadence: quarterly. Last regenerated 2026-08-08 (4dcc70e2).
# The cert-count delta is the number to look at: a large drop means curl.se
# distrusted a root, which is exactly the change that breaks TLS for some host.
[tasks."ca:refresh"]
description = "Regenerate src/cacert.c from curl.se and report the cert-count delta"
run = """
set -eu
count() {
  python3 - "$1" <<'PY'
import re, sys, zlib
data = open(sys.argv[1]).read()
blob = bytes(int(b, 16) for b in re.findall(r'0x([0-9a-f]{2})', data))
print(zlib.decompress(blob[4:]).count(b'BEGIN CERTIFICATE'))
PY
}
before=$(count src/cacert.c)
sh scripts/update-ca-bundle.sh
after=$(count src/cacert.c)
echo "certificates: $before -> $after (delta $((after - before)))"
git diff --stat -- src/cacert.c
"""
