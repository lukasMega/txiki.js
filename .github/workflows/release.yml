name: Releases

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master

jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
      - name: Install dependencies
        run: vcpkg install libffi:x64-windows-static
      - name: Configure
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Build
        run: cmake --build build --config Release
      - name: Show DLL dependencies
        run: |
          $dumpbin = (Resolve-Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe")[-1].Path
          & $dumpbin /DEPENDENTS build/Release/tjs.exe
      - name: Package
        run: |
          mkdir txiki-windows-x86_64
          cp build/Release/tjs.exe txiki-windows-x86_64/tjs.exe

      - name: Upload windows x86_64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-windows-x86_64
          path: txiki-windows-x86_64

      - name: Configure (slim)
        run: |
          cmake -B build-slim -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBUILD_WITH_WASM=OFF -DBUILD_WITH_SQLITE=OFF -DBUILD_WITH_TLS=OFF -DBUILD_WITH_STRIP=ON -DBUILD_WITH_LTO=ON
      - name: Build (slim)
        run: cmake --build build-slim --config MinSizeRel
      - name: Package (slim)
        run: |
          mkdir txiki-windows-x86_64-slim
          cp build-slim/MinSizeRel/tjs.exe txiki-windows-x86_64-slim/tjs.exe

      - name: Upload windows x86_64 slim Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-windows-x86_64-slim
          path: txiki-windows-x86_64-slim

  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: build macos arm64
        run: |
          make

          mkdir txiki-macos-arm64
          cp build/tjs txiki-macos-arm64/tjs

      - name: Upload macos arm64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-macos-arm64
          path: txiki-macos-arm64

      - name: build macos arm64 slim
        run: |
          cmake -B build-slim -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_WITH_WASM=OFF -DBUILD_WITH_SQLITE=OFF -DBUILD_WITH_TLS=OFF -DBUILD_WITH_STRIP=ON -DBUILD_WITH_LTO=ON
          cmake --build build-slim -j $(sysctl -n hw.ncpu)

          mkdir txiki-macos-arm64-slim
          cp build-slim/tjs txiki-macos-arm64-slim/tjs

      - name: Upload macos arm64 slim Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-macos-arm64-slim
          path: txiki-macos-arm64-slim

  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: build macos x86_64
        run: |
          make

          mkdir txiki-macos-x86_64
          cp build/tjs txiki-macos-x86_64/tjs

      - name: Upload macos x86_64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-macos-x86_64
          path: txiki-macos-x86_64

      - name: build macos x86_64 slim
        run: |
          cmake -B build-slim -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_WITH_WASM=OFF -DBUILD_WITH_SQLITE=OFF -DBUILD_WITH_TLS=OFF -DBUILD_WITH_STRIP=ON -DBUILD_WITH_LTO=ON
          cmake --build build-slim -j $(sysctl -n hw.ncpu)

          mkdir txiki-macos-x86_64-slim
          cp build-slim/tjs txiki-macos-x86_64-slim/tjs

      - name: Upload macos x86_64 slim Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-macos-x86_64-slim
          path: txiki-macos-x86_64-slim

  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libffi-dev
      - name: build linux x86_64
        run: |
          make

          mkdir txiki-linux-x86_64
          cp build/tjs txiki-linux-x86_64/tjs

      - name: Upload linux x86_64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-linux-x86_64
          path: txiki-linux-x86_64

      - name: build linux x86_64 slim
        run: |
          cmake -B build-slim -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_WITH_WASM=OFF -DBUILD_WITH_SQLITE=OFF -DBUILD_WITH_TLS=OFF -DBUILD_WITH_STRIP=ON -DBUILD_WITH_LTO=ON
          cmake --build build-slim -j $(getconf _NPROCESSORS_ONLN)

          mkdir txiki-linux-x86_64-slim
          cp build-slim/tjs txiki-linux-x86_64-slim/tjs

      - name: Upload linux x86_64 slim Artifact
        uses: actions/upload-artifact@v7
        with:
          name: txiki-linux-x86_64-slim
          path: txiki-linux-x86_64-slim

  release:
    needs: [build-windows-x86_64, build-macos-arm64, build-macos-x86_64, build-linux-x86_64]
    name: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: txiki-*
          merge-multiple: false

      - name: compress
        run: |
          cd dist
          for dir in */; do
            # actions/upload-artifact strips the executable bit, so restore it on the
            # Unix binary before zipping (Info-ZIP preserves Unix permissions, so the
            # bit then survives all the way to the downloaded zip).
            [ -f "${dir}tjs" ] && chmod +x "${dir}tjs"
            zip -r "${dir%/}.zip" "$dir"
          done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: "dist/*.zip"
