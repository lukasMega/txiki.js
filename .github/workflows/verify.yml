name: Verify (slim profiles)

# Per-push gate: build each published profile and run the WHOLE suite against
# the artifact that would actually ship. Every profile compiles `test` out, so
# the full-CLI host `tjs` (--host-tjs) drives the loop while TJS_TEST_EXE points
# each test file at the slim binary; the skip filter probes the binary under
# test, so the tallies describe the artifact.
#
# Linux only, by design -- this is the fast per-merge signal; dist.yml covers
# the other platforms before anything is published. Keep the two matrices in
# step: a profile verified here but not built there would ship untested.

# The pull_request trigger is deliberately unfiltered, on BOTH axes. These six
# job names are required status checks, and GitHub reports no check at all for a
# workflow an event filter skipped -- which leaves the PR permanently "Expected"
# and unmergeable. Two filters used to be here and both hit it:
#
#   paths-ignore: website/**, types/**, **/*.md   -> a docs-only PR was stuck
#   branches: [ slim ]                            -> a stacked PR was stuck,
#       because a PR based on another feature branch is not a PR "to slim"
#
# Do not re-add either without first moving these contexts out of the required
# set. The push trigger keeps its branch filter: pushes to a feature branch are
# already covered by that branch's PR.
on:
  push:
    branches: [ slim ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [ min, ffi, tls, ffi-tls, sqlite, ffi-tls-sqlite ]
    env:
      # `mise run` installs every tool in mise.toml first, and upstream publishes
      # no Linux asset for the `ubi:saghul/txiki.js` pin -- the job would die
      # installing a binary it never uses.
      MISE_DISABLE_TOOLS: 'ubi:saghul/txiki.js'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - name: Install dependencies
        if: contains(matrix.profile, 'ffi')
        run: |
          sudo apt update
          sudo apt install -y libffi-dev

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # --host-tjs adds the full-CLI driver and the test fixtures to build-host,
      # the tree build-dist.mjs already configures for tjsc.
      - name: Build ${{ matrix.profile }} + host driver
        run: >-
          mise run dist --
          --profile ${{ matrix.profile }}
          --out dist/${{ matrix.profile }}
          --host-tjs

      # TJS_TEST_LIBDIR points the fixture lookups at build-host instead of
      # their ./build default.
      - name: Run the suite against dist/${{ matrix.profile }}
        env:
          TJS_TEST_EXE: ${{ github.workspace }}/dist/${{ matrix.profile }}/tjs
          TJS_TEST_LIBDIR: ./build-host
        run: ./build-host/tjs test tests/ 2>&1 | tee test-output.txt

      - name: Job summary
        # Tallies even on failure: a profile that goes green by skipping half
        # the suite is the failure mode this harness exists to catch.
        if: always()
        run: |
          # printf, not \x1b: that spelling is GNU-sed-only, and a sed matching
          # nothing would leave the tallies at zero -- which reads as "clean".
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*m//g" test-output.txt > test-plain.txt || : > test-plain.txt
          count() { grep -cE "[[:space:]]$1\$" test-plain.txt || true; }
          ok=$(count OK); skip=$(count SKIP); fail=$(count FAIL); timeout=$(count TIMEOUT)

          if [ -s test-output.txt ] && [ $((ok + skip + fail + timeout)) -eq 0 ]; then
            echo "::warning::the suite produced output but no result lines could be parsed"
          fi

          {
            echo "### ${{ matrix.profile }}"
            echo
            echo "| OK | SKIP | FAIL | TIMEOUT |"
            echo "| ---: | ---: | ---: | ---: |"
            echo "| $ok | $skip | $fail | $timeout |"
            echo
            echo '```'
            cat dist/${{ matrix.profile }}/BUILDINFO.txt || echo '(no BUILDINFO: the build failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verify-${{ matrix.profile }}-output
          path: |
            test-output.txt
            dist/${{ matrix.profile }}/BUILDINFO.txt
          if-no-files-found: warn
