name: Verify (slim profiles)

# Per-push gate for the fork's slim builds: build each published profile and run
# the WHOLE test suite against the artifact that would actually ship.
#
# The artifacts cannot drive the suite themselves -- every profile compiles the
# `test` subcommand out -- so the full-CLI host `tjs` built alongside them (via
# `--host-tjs`) runs the loop while TJS_TEST_EXE points each test file at the
# slim binary. The skip filter probes the binary under test, not the host, so
# the skip counts below describe the artifact.
#
# The feature vector itself is asserted inside the build: scripts/build-dist.mjs
# smoke-tests wasm/sqlite/webcrypto/ffi/tls/bundledCa on the freshly built
# binary, so a silently flipped CMake default fails there rather than as a
# puzzling test failure here.
#
# Linux only, by design: this is the fast per-merge signal. dist.yml runs the
# same suite on all four platforms before anything is published.

on:
  push:
    branches: [ slim ]
    paths-ignore:
      - 'website/**'
      - 'types/**'
      - '**/*.md'
  pull_request:
    branches: [ slim ]
    paths-ignore:
      - 'website/**'
      - 'types/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [ min, ffi, tls, ffi-tls ]
    env:
      # mise.toml pins `ubi:saghul/txiki.js`, for which upstream publishes no
      # Linux asset; `mise run` installs every tool in the config before running
      # a task, so without this the job dies installing a binary it never uses.
      MISE_DISABLE_TOOLS: 'ubi:saghul/txiki.js'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - name: Install dependencies
        if: contains(matrix.profile, 'ffi')
        run: |
          sudo apt update
          sudo apt install -y libffi-dev

      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # --host-tjs adds the full-CLI driver and the test fixture libraries to
      # build-host, the tree build-dist.mjs already configures for tjsc.
      - name: Build ${{ matrix.profile }} + host driver
        run: >-
          mise run dist --
          --profile ${{ matrix.profile }}
          --out dist/${{ matrix.profile }}
          --host-tjs

      # TJS_TEST_LIBDIR sends tests/helpers/ffi.js at build-host's
      # libffi-test instead of its ./build default.
      - name: Run the suite against dist/${{ matrix.profile }}
        env:
          TJS_TEST_EXE: ${{ github.workspace }}/dist/${{ matrix.profile }}/tjs
          TJS_TEST_LIBDIR: ./build-host
        run: ./build-host/tjs test tests/ 2>&1 | tee test-output.txt

      - name: Job summary
        # Report the tallies even when the suite failed: a profile that goes
        # green by skipping half the suite is the failure mode this whole
        # harness exists to catch, so the skip count is part of the result.
        if: always()
        run: |
          # Build the escape byte with printf rather than writing \x1b: only GNU
          # sed understands that spelling, and a sed that quietly matches nothing
          # would leave the tallies at zero -- which reads as "clean" and is
          # exactly the false green this harness exists to catch.
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*m//g" test-output.txt > test-plain.txt || : > test-plain.txt
          count() { grep -cE "[[:space:]]$1\$" test-plain.txt || true; }
          ok=$(count OK); skip=$(count SKIP); fail=$(count FAIL); timeout=$(count TIMEOUT)

          if [ -s test-output.txt ] && [ $((ok + skip + fail + timeout)) -eq 0 ]; then
            echo "::warning::the suite produced output but no result lines could be parsed"
          fi

          {
            echo "### ${{ matrix.profile }}"
            echo
            echo "| OK | SKIP | FAIL | TIMEOUT |"
            echo "| ---: | ---: | ---: | ---: |"
            echo "| $ok | $skip | $fail | $timeout |"
            echo
            echo '```'
            cat dist/${{ matrix.profile }}/BUILDINFO.txt || echo '(no BUILDINFO: the build failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verify-${{ matrix.profile }}-output
          path: |
            test-output.txt
            dist/${{ matrix.profile }}/BUILDINFO.txt
          if-no-files-found: warn
