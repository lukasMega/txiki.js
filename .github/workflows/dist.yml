name: Dist (slim binaries)

# Builds every published slim `tjs` profile on every supported platform via the
# portable Node driver (scripts/build-dist.mjs), then puts all of them on one
# Release. The size gate is report-only until real per-platform numbers are
# recorded -- pass --enforce-size then.
#
# Profiles (--profile): min, ffi, tls, ffi-tls. They differ only in FFI and TLS;
# all four are MinSizeRel + compressed bytecode + slim CLI, and keep WebCrypto,
# `run`, the REPL and `compile`. Unix builds are additionally hardened; MSVC
# compiles the hardening and most size levers out, so those artifacts are named
# without the "-hardened" suffix and get a larger size budget.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish the built binaries to a GitHub Release under this tag
          (e.g. slim-v1.2.3). The tag is created on the checked-out commit if it
          does not exist. Leave empty to only upload workflow artifacts.
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # One tag publishes all four profiles as assets of a single Release. The
      # per-profile spellings are accepted too, so `slim-tls-v1.2.3` works and
      # simply names the profile someone cares about.
      - "slim-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-min-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-ffi-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-tls-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-ffi-tls-v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - 'scripts/build-dist.mjs'
      - '.github/workflows/dist.yml'
      - 'CMakeLists.txt'

jobs:
  build:
    name: ${{ matrix.profile }} ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Two axes, not `include`: an include entry whose keys are absent from the
      # matrix is merged into every combination (last one winning) instead of
      # multiplying out, which would silently build one platform four times.
      matrix:
        profile: [ min, ffi, tls, ffi-tls ]
        target:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x86_64, os: windows-latest }
    env:
      # mise.toml pins `ubi:saghul/txiki.js` for local use, and upstream publishes
      # no Linux asset for it. `mise run` installs every tool in the config before
      # running a task, so without this the Linux jobs die installing a binary the
      # build never uses.
      MISE_DISABLE_TOOLS: 'ubi:saghul/txiki.js'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Unix uses mise (mise.toml pins node and owns the `dist` task, so CI and
      # local dev run the exact same command). Windows keeps setup-node: the
      # mise task shell is POSIX sh, which the Windows runner does not have.
      - name: Setup mise (Unix)
        if: runner.os != 'Windows'
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - uses: actions/setup-node@v6
        if: runner.os == 'Windows'
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && contains(matrix.profile, 'ffi')
        run: |
          sudo apt update
          sudo apt install -y libffi-dev

      # Set up for every Windows profile, not just the FFI ones: the build step
      # always passes the vcpkg toolchain file, which must exist even when the
      # only package it provides (libffi) is not installed.
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Install libffi (Windows)
        if: runner.os == 'Windows' && contains(matrix.profile, 'ffi')
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: vcpkg install libffi:x64-windows-static

      # esbuild is resolved from node_modules by the build script; `npx esbuild`
      # is deliberately not used (network per run, version-unstable bundles).
      - name: Install npm dependencies
        run: npm install --ignore-scripts

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: mise run dist -- --profile ${{ matrix.profile }} --out dist

      - name: Build (Windows)
        # node:util parseArgs refuses an option value that starts with a dash
        # unless it is written with `=`, so these cannot be split into two words.
        run: >
          node scripts/build-dist.mjs --profile ${{ matrix.profile }} --out dist
          "--cmake-arg=-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          "--cmake-arg=-DVCPKG_TARGET_TRIPLET=x64-windows-static"
        if: runner.os == 'Windows'

      - name: Job summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.profile }} ${{ matrix.target.name }}"
            echo '```'
            cat dist/BUILDINFO.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: txiki-slim-${{ matrix.profile }}-${{ matrix.target.name }}
          path: dist

  # Publishes the slim binaries under Releases. Runs on any pushed tag matched
  # above, or on a manual run that supplied `release_tag` (the tag is then
  # created on the checked-out commit by the release action).
  #
  # All four profiles land on one Release as
  # txiki-slim-<profile>-<platform>.zip. The `txiki-slim-` prefix also keeps them
  # from colliding with the upstream release.yml assets (`txiki-<platform>.zip`),
  # which target the same `v*` tags and would otherwise overwrite each other.
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: txiki-slim-*
          merge-multiple: false

      - name: Package
        run: |
          cd dist
          : > SHA256SUMS.txt
          for dir in */; do
            name="${dir%/}"
            # actions/upload-artifact strips the executable bit; restore it
            # before zipping (Info-ZIP preserves Unix permissions).
            [ -f "${dir}tjs" ] && chmod +x "${dir}tjs"
            awk -v d="$name" '{ print $1 "  " d "/" $2 }' "${dir}SHA256SUMS" >> SHA256SUMS.txt
            zip -r "${name}.zip" "$dir"
          done
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          {
            echo "Slim txiki.js builds (\`scripts/build-dist.mjs\`), four feature"
            echo "profiles x four platforms."
            echo
            echo "| profile | FFI (\`tjs:ffi\`) | TLS (HTTPS/WSS/TLSSocket) |"
            echo "| --- | --- | --- |"
            echo "| \`min\`     | no  | no  |"
            echo "| \`ffi\`     | yes | no  |"
            echo "| \`tls\`     | no  | yes (bundled CA) |"
            echo "| \`ffi-tls\` | yes | yes (bundled CA) |"
            echo
            echo "All four: MinSizeRel, compressed bytecode, hardened (except MSVC,"
            echo "which compiles those levers out), no WebAssembly, no SQLite, no"
            echo "mimalloc, and no \`eval\`/\`serve\`/\`test\`/\`bundle\`/\`app\`"
            echo "subcommands. Always present: WebCrypto, \`run\`, the REPL, \`compile\`."
            echo
            for f in dist/*/BUILDINFO.txt; do
              echo '```'
              echo "$(basename "$(dirname "$f")")"
              cat "$f"
              echo '```'
            done
          } > NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }} (slim builds)
          body_path: NOTES.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
