name: Dist (slim binaries)

# Every profile x platform, each running the full suite before anything is
# published (`release` needs: build). The size gate is tag-only so a legitimate
# growth lands in a PR job summary instead of blocking it.
#
# A profile added here costs four jobs. The two alternative codegen modes
# therefore ship only with the minimum feature set instead of doubling all six
# smallest profiles.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish the built binaries to a GitHub Release under this tag
          (e.g. slim-v1.2.3). The tag is created on the checked-out commit if it
          does not exist. Leave empty to only upload workflow artifacts.
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # One tag publishes every profile; the per-profile spellings are accepted
      # too and simply name the profile someone cares about.
      - "slim-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-min-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-balanced-min-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-tuned-min-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-ffi-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-tls-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-sqlite-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-ffi-tls-v[0-9]+.[0-9]+.[0-9]+*"
      - "slim-ffi-tls-sqlite-v[0-9]+.[0-9]+.[0-9]+*"
  # Unfiltered on purpose -- the path filter lives in the `gate` job below,
  # because `on.pull_request` ANDs `paths` with `types` and cannot express
  # "these paths OR this label".
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]

# Guarded on the event, not a flat `true`: `release` uploads assets, so a second
# tag push must never cancel a publish in flight.
concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a pull_request event deserves the 32-job matrix. Two ways in:
  # the PR touches something that changes what gets built, or it carries the
  # `auto-release` label -- the upstream-release proposal, which must have the
  # full four-platform signal before it lands on `slim`, not verify.yml's
  # Linux-only six.
  gate:
    name: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          AUTO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'auto-release') }}
        run: |
          set -euo pipefail
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "run=$1"; exit 0; }

          [ "$EVENT" = 'pull_request' ] || decide true

          if [ "$AUTO_RELEASE" = 'true' ]; then
            echo '::notice::auto-release PR -- running the full matrix'
            decide true
          fi

          # `gh pr diff --name-only` would need a checkout; the API does not.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed.txt
          if grep -qxE 'scripts/build-dist\.mjs|\.github/workflows/dist\.yml|CMakeLists\.txt|cmake/slim\.cmake' changed.txt; then
            decide true
          fi
          decide false

  build:
    name: ${{ matrix.optimization == 'smallest' && matrix.profile || format('{0}-{1}', matrix.optimization, matrix.profile) }} ${{ matrix.target.name }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Two axes, not `include`: an include entry whose keys are absent from the
      # matrix is merged into every combination instead of multiplying out.
      matrix:
        profile: [ min, ffi, tls, ffi-tls, sqlite, ffi-tls-sqlite ]
        optimization: [ smallest, balanced, tuned ]
        exclude:
          - { profile: ffi, optimization: balanced }
          - { profile: tls, optimization: balanced }
          - { profile: ffi-tls, optimization: balanced }
          - { profile: sqlite, optimization: balanced }
          - { profile: ffi-tls-sqlite, optimization: balanced }
          - { profile: ffi, optimization: tuned }
          - { profile: tls, optimization: tuned }
          - { profile: ffi-tls, optimization: tuned }
          - { profile: sqlite, optimization: tuned }
          - { profile: ffi-tls-sqlite, optimization: tuned }
        target:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x86_64, os: windows-latest }
    env:
      # `mise run` installs every tool in mise.toml first, and upstream publishes
      # no Linux asset for the `ubi:saghul/txiki.js` pin -- the Linux jobs would
      # die installing a binary the build never uses.
      MISE_DISABLE_TOOLS: 'ubi:saghul/txiki.js'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Windows keeps setup-node: the mise task shell is POSIX sh, which the
      # Windows runner does not have.
      - name: Setup mise (Unix)
        if: runner.os != 'Windows'
        uses: jdx/mise-action@v3
        with:
          experimental: true

      - uses: actions/setup-node@v6
        if: runner.os == 'Windows'
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && contains(matrix.profile, 'ffi')
        run: |
          sudo apt update
          sudo apt install -y libffi-dev

      # Every Windows profile, not just the FFI ones: the build step always
      # passes the vcpkg toolchain file, which must exist even when libffi
      # (the only package it provides) is not installed.
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Install libffi (Windows)
        if: runner.os == 'Windows' && contains(matrix.profile, 'ffi')
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: vcpkg install libffi:x64-windows-static

      # esbuild comes from node_modules, not `npx` (network per run, and
      # version-unstable bundles).
      - name: Install npm dependencies
        run: npm install --ignore-scripts

      # --host-tjs also builds the full-CLI driver and the test fixtures into
      # build-host; the artifact cannot run the suite itself.
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: >-
          mise run dist -- --profile ${{ matrix.profile }} --out dist --host-tjs
          --optimization ${{ matrix.optimization }}
          ${{ startsWith(github.ref, 'refs/tags/') && '--enforce-size' || '' }}

      - name: Build (Windows)
        # node:util parseArgs refuses an option value that starts with a dash
        # unless it is written with `=`, so these cannot be split into two words.
        run: >
          node scripts/build-dist.mjs --profile ${{ matrix.profile }} --out dist --host-tjs
          --optimization ${{ matrix.optimization }}
          ${{ startsWith(github.ref, 'refs/tags/') && '--enforce-size' || '' }}
          "--cmake-arg=-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          "--cmake-arg=-DVCPKG_TARGET_TRIPLET=x64-windows-static"
        if: runner.os == 'Windows'

      # The artifact's `test` subcommand is compiled out, so the host driver runs
      # the loop and TJS_TEST_EXE points every test file at the artifact. The
      # skip filter probes the artifact, so the tallies describe it, not the
      # driver; TJS_TEST_LIBDIR sends fixture lookups to the same tree.
      - name: Test the artifact
        shell: bash
        env:
          TJS_TEST_EXE: ${{ github.workspace }}/dist/tjs${{ runner.os == 'Windows' && '.exe' || '' }}
          TJS_TEST_LIBDIR: ./build-host
        run: |
          host=./build-host/tjs
          [ -x "$host" ] || host=./build-host/tjs.exe
          "$host" test tests/ 2>&1 | tee test-output.txt

      - name: Job summary
        if: always()
        shell: bash
        run: |
          # printf, not \x1b: that spelling is GNU-sed-only, and a sed matching
          # nothing would leave the tallies at zero -- which reads as "clean".
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*m//g" test-output.txt > test-plain.txt || : > test-plain.txt
          count() { grep -cE "[[:space:]]$1\$" test-plain.txt || true; }
          ok=$(count OK); skip=$(count SKIP); fail=$(count FAIL); timeout=$(count TIMEOUT)

          if [ -s test-output.txt ] && [ $((ok + skip + fail + timeout)) -eq 0 ]; then
            echo "::warning::the suite produced output but no result lines could be parsed"
          fi

          {
            echo "### ${{ matrix.optimization == 'smallest' && matrix.profile || format('{0}-{1}', matrix.optimization, matrix.profile) }} ${{ matrix.target.name }}"
            echo
            echo "| OK | SKIP | FAIL | TIMEOUT |"
            echo "| ---: | ---: | ---: | ---: |"
            echo "| $ok | $skip | $fail | $timeout |"
            echo
            echo '```'
            cat dist/BUILDINFO.txt || echo '(no BUILDINFO: the build failed)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: txiki-slim-${{ matrix.optimization == 'smallest' && matrix.profile || format('{0}-{1}', matrix.optimization, matrix.profile) }}-${{ matrix.target.name }}
          path: dist

  # Every profile lands on one Release as txiki-slim-<profile>-<platform>.zip.
  # The `txiki-slim-` prefix keeps them from colliding with upstream
  # release.yml's `txiki-<platform>.zip`, which targets the same `v*` tags.
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: txiki-slim-*
          merge-multiple: false

      - name: Package
        run: |
          cd dist
          : > SHA256SUMS.txt
          for dir in */; do
            name="${dir%/}"
            # upload-artifact strips the executable bit; Info-ZIP preserves it.
            [ -f "${dir}tjs" ] && chmod +x "${dir}tjs"
            awk -v d="$name" '{ print $1 "  " d "/" $2 }' "${dir}SHA256SUMS" >> SHA256SUMS.txt
            zip -r "${name}.zip" "$dir"
          done
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          {
            echo "Slim txiki.js builds (\`scripts/build-dist.mjs\`), eight profiles"
            echo "x four platforms."
            echo
            echo "| profile | codegen | FFI (\`tjs:ffi\`) | TLS (HTTPS/WSS/TLSSocket) | SQLite (\`tjs:sqlite\`) |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| \`balanced-min\`   | \`-Os\`, no LTO       | no  | no               | no  |"
            echo "| \`tuned-min\`      | \`-Oz\` + LTO, no outliner | no  | no          | no  |"
            echo "| \`min\`            | \`-Oz\` + LTO        | no  | no               | no  |"
            echo "| \`ffi\`            | \`-Oz\` + LTO        | yes | no               | no  |"
            echo "| \`tls\`            | \`-Oz\` + LTO        | no  | yes (bundled CA) | no  |"
            echo "| \`sqlite\`         | \`-Oz\` + LTO        | no  | no               | yes |"
            echo "| \`ffi-tls\`        | \`-Oz\` + LTO        | yes | yes (bundled CA) | no  |"
            echo "| \`ffi-tls-sqlite\` | \`-Oz\` + LTO        | yes | yes (bundled CA) | yes |"
            echo
            echo "The codegen column describes what is *requested*. \`-Oz\` and the"
            echo "AArch64 machine outliner are Clang-only, so the Linux (GCC) and"
            echo "Windows (MSVC) artifacts fall back to \`-Os\`/\`/O1\` and the three"
            echo "\`min\` variants differ there only in LTO. On macOS all three are"
            echo "distinct; see BUILDINFO.txt per artifact."
            echo
            echo "\`localStorage\` is persistent only on the SQLite profiles; the"
            echo "others fall back to an in-memory store."
            echo
            echo "All profiles use MinSizeRel, compressed bytecode, hardened (except MSVC,"
            echo "which compiles those levers out), no WebAssembly, no"
            echo "mimalloc, and no \`eval\`/\`serve\`/\`test\`/\`bundle\`/\`app\`"
            echo "subcommands. Always present: WebCrypto, \`run\`, the REPL, \`compile\`."
            echo
            # The blank line after </summary> is what keeps the fenced blocks
            # inside parsing as Markdown rather than as literal text.
            echo '<details>'
            echo "<summary>see details, sha256, ... ($(ls -d dist/*/ | wc -l | tr -d ' ') builds)</summary>"
            echo
            for f in dist/*/BUILDINFO.txt; do
              echo '```'
              echo "$(basename "$(dirname "$f")")"
              cat "$f"
              echo '```'
            done
            echo '</details>'
          } > NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }} (slim builds)
          body_path: NOTES.md
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
