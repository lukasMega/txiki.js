name: merge-check

# Dry-runs the upstream merge daily and keeps ONE issue up to date with the
# conflicted paths. No build, no push -- a tripwire, not a gate.
#
# Both numbers matter: a rising `behind` with zero conflicts is the merge you
# should simply do, before it grows teeth.

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: merge-check
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # a merge base cannot be computed from a shallow clone
          submodules: false       # not needed to compute a merge

      - name: Attempt the merge
        id: merge
        run: |
          set -uo pipefail
          # Without this the generated bundles conflict on every single run and
          # the issue becomes noise you learn to ignore. See .gitattributes.
          sh scripts/setup-repo.sh
          git config user.name  'merge-check'
          git config user.email 'merge-check@users.noreply.github.com'
          git remote add upstream https://github.com/saghul/txiki.js.git
          git fetch --no-tags upstream master

          echo "behind=$(git rev-list --count HEAD..upstream/master)" >> "$GITHUB_OUTPUT"

          if git merge --no-commit --no-ff upstream/master >/dev/null 2>&1; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'conflicts<<GHA_EOF'
              git diff --name-only --diff-filter=U
              echo GHA_EOF
            } >> "$GITHUB_OUTPUT"
          fi

          git merge --abort || true

      # One issue, reused: opened on conflict, edited while it persists, closed
      # when clean. A new issue per run is a firehose nobody reads.
      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BEHIND: ${{ steps.merge.outputs.behind }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='Upstream merge is conflicted'

          # Created up front, not lazily on the first conflict: `gh issue list
          # --label` errors out on a label that does not exist yet.
          gh label create upstream-merge --repo "$REPO" --color d93f0b \
            --description 'Opened by the merge-check tripwire' 2>/dev/null || true

          # The tracker is a reporting channel, not the check. It was disabled
          # on this fork for months, and `set -e` here made the job fail
          # identically on the clean and conflicted paths -- a red X that says
          # nothing. Probe once and degrade to annotations instead.
          issues_ok=1
          existing=$(gh issue list --repo "$REPO" --state open --label upstream-merge \
            --json number --jq '.[0].number // empty' 2>issue-probe.txt) || issues_ok=0
          if [ "$issues_ok" -eq 0 ]; then
            existing=
            echo "::warning::cannot use the issue tracker ($(tr '\n' ' ' < issue-probe.txt)); reporting via annotations only"
          fi

          {
            echo "### $BEHIND upstream commits unmerged"
            echo
            if [ -z "$CONFLICTS" ]; then
              echo 'The dry-run merge is **clean** — no conflicts.'
            else
              echo 'The dry-run merge **conflicts** in:'
              echo
              echo '```'
              echo "$CONFLICTS"
              echo '```'
              echo
              echo 'Resolve with `mise run sync:upstream`. Do not hand-resolve'
              echo '`src/bundles/c/**` — it is regenerated, and `scripts/setup-repo.sh`'
              echo 'should have kept it out of this list entirely.'
            fi
            echo
            echo "_Updated by [merge-check]($RUN_URL)._"
          } > body.md

          # A clean dry-run opens no issue, so the summary is the only place the
          # nudge can land: `behind` alone is a number nobody acts on.
          {
            echo "### merge-check"
            echo
            echo "behind: **$BEHIND** — conflicts: **${CONFLICTS:-none}**"
            echo
            if [ -z "$CONFLICTS" ] && [ "$BEHIND" -gt 0 ]; then
              echo "The merge is clean. Take it now, before it grows teeth:"
              echo
              echo '```sh'
              echo 'mise run sync:upstream'
              echo '```'
            elif [ -n "$CONFLICTS" ] && [ "$issues_ok" -eq 1 ]; then
              echo "See the [\`upstream-merge\`]($GITHUB_SERVER_URL/$REPO/issues?q=is%3Aopen+label%3Aupstream-merge) issue."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$issues_ok" -eq 0 ]; then
            # No issue to carry state, so the conflict has to be loud in the one
            # place that is left: the run's own conclusion.
            if [ -n "$CONFLICTS" ]; then
              echo "::error::upstream merge conflicts in: $(echo "$CONFLICTS" | tr '\n' ' ')"
              exit 1
            fi
            echo "clean, and the issue tracker is unavailable"
          elif [ -n "$CONFLICTS" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$REPO" --body-file body.md
              echo "updated issue #$existing"
            else
              gh issue create --repo "$REPO" --title "$TITLE" \
                --label upstream-merge --body-file body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" \
              --body "The upstream merge is clean again ($BEHIND commits behind). Closing."
            gh issue close "$existing" --repo "$REPO"
            echo "closed issue #$existing"
          else
            echo "clean, nothing to report"
          fi
