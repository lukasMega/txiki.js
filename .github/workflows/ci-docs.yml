name: CI (Docs)

on:
  pull_request:
    paths:
      - 'website/**'
      - 'types/**'
      - 'benchmarks/history/**'
      - 'scripts/measure-feature-costs.mjs'
      - 'scripts/release-size-manifest.mjs'
      - 'scripts/test/slim-metrics.test.mjs'

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
    - name: Install dependencies
      run: npm install
    - name: Test slim metrics
      run: node --test scripts/test/slim-metrics.test.mjs
    - name: Check slim metrics
      run: node website/scripts/generate-slim-metrics.mjs --check
    - name: Build the docs
      run: npm run docs
